services:
  # -----------------------------
  # 1) MySQL (Private Service)
  # -----------------------------
  - type: private_service
    name: mysql
    env: docker
    rootDir: mysql
    plan: starter   # change to a larger plan if needed
    autoDeploy: true
    envVars:
      - key: MYSQL_DATABASE
        value: wordpress
      - key: MYSQL_USER
        value: wpuser
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    healthCheckPath: /
    # Private services don’t get a public URL; WP connects to mysql.internal:3306

  # -----------------------------
  # 2) WordPress (Web Service)
  # -----------------------------
  - type: web
    name: wordpress
    env: docker
    rootDir: wordpress
    plan: starter   # free plan can work for testing; it sleeps on inactivity
    autoDeploy: true
    envVars:
      - key: PORT
        value: "80"
      - key: WORDPRESS_DB_HOST
        value: "mysql.internal:3306"     # Resolves to the private MySQL service
      - key: WORDPRESS_DB_NAME
        value: wordpress
      - key: WORDPRESS_DB_USER
        value: wpuser
      - key: WORDPRESS_DB_PASSWORD
        fromService:
          name: mysql
          type: env_var
          envVarKey: MYSQL_PASSWORD
      - key: WORDPRESS_TABLE_PREFIX
        value: wp_

    # Optional persistent disk for media uploads
    disks:
      - name: wp-uploads
        mountPath: /var/www/html/wp-content/uploads
        sizeGB: 5
